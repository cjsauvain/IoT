apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-bonus-jsauvain
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'http://gitlab-service.gitlab.svc.cluster.local:8889/root/iot-bonus-jsauvain.git'
    targetRevision: HEAD
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  timeout.reconciliation: 10s
