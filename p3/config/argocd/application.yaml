apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-app-p3
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arthurfaby/iot-app-afaby.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
