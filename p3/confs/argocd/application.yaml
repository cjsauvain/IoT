apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-app-p3
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arthurfaby/iot-app-afaby.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  timeout.reconciliation: 10s
